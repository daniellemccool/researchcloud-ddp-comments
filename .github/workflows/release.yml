name: release

on:
  push:
    tags:
      - "v*"

# Jobs raise what they need: images writes packages, promote writes contents.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # persist-credentials: false: this job never pushes to the repository,
      # so the checkout must not carry a write token.
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the pins
        run: scripts/check-pins.sh "$GITHUB_REF_NAME"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push desk
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/desk/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}/desk:${{ github.ref_name }}

      - name: Build and push deskproxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/deskproxy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}/deskproxy:${{ github.ref_name }}

      - name: Read the pinned 4CAT image
        id: fourcat
        run: |
          set -euo pipefail
          src="$(sed -n 's/^FOURCAT_IMAGE=//p' deploy/.env.example)"
          if [ -z "$src" ]; then
            echo "FOURCAT_IMAGE not found in deploy/.env.example" >&2
            exit 1
          fi
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "tag=${src##*:}" >> "$GITHUB_OUTPUT"

      - name: Mirror 4CAT
        env:
          SRC: ${{ steps.fourcat.outputs.src }}
          TAG: ${{ steps.fourcat.outputs.tag }}
          DEST: ghcr.io/${{ github.repository }}/4cat
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GH_USER" --password-stdin
          skopeo copy --all "docker://$SRC" "docker://$DEST:$TAG"

      - name: Read the pinned Firefox image
        id: firefox
        run: |
          set -euo pipefail
          src="$(sed -n 's/^FIREFOX_IMAGE=//p' deploy/.env.example)"
          if [ -z "$src" ]; then
            echo "FIREFOX_IMAGE not found in deploy/.env.example" >&2
            exit 1
          fi
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "tag=${src##*:}" >> "$GITHUB_OUTPUT"

      - name: Mirror Firefox
        env:
          SRC: ${{ steps.firefox.outputs.src }}
          TAG: ${{ steps.firefox.outputs.tag }}
          DEST: ghcr.io/${{ github.repository }}/firefox
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GH_USER" --password-stdin
          skopeo copy --all "docker://$SRC" "docker://$DEST:$TAG"

  promote:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 is load-bearing: the Move the release branch step runs
      # git merge-base --is-ancestor against origin/release, which needs the
      # tagged commit's full history, not the default shallow tag checkout.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The branch `release` moves only when everything a launch needs
      # exists: the artifact named by every platforms/*/template.json must be
      # a fully uploaded asset of the published (non-draft) GitHub release
      # for this tag (uploaded by hand right after the tag was pushed), and
      # its sha256 must match the manifest's template_sha256. Poll every
      # 30 s for up to 40 minutes; a missing release counts as "not yet". A
      # digest mismatch fails the job immediately instead of polling. On
      # timeout the job fails, so the branch does not move.
      - name: Wait for the template artifacts
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 40 * 60))
          while :; do
            if json=$(gh release view "$GITHUB_REF_NAME" --json assets,isDraft 2>/tmp/gh-err); then
              :
            else
              gh_err=$(cat /tmp/gh-err)
              case $gh_err in
              *"not found"* | *"Not Found"* | *"404"*)
                json="" # release not created yet: keep polling
                ;;
              *)
                echo "gh release view error (continuing to poll): $gh_err"
                json=""
                ;;
              esac
            fi
            missing=""
            for m in platforms/*/template.json; do
              artifact=$(jq -r '.artifact' "$m")
              want=$(jq -r '.template_sha256' "$m")
              if ! printf '%s' "$json" | jq -e --arg n "$artifact" \
                '(.isDraft | not) and any(.assets[]; .name == $n and .state == "uploaded")' >/dev/null; then
                missing="$missing $artifact"
                continue
              fi
              # The asset is uploaded on a non-draft release: verify its
              # digest against the manifest before counting it as present.
              gh release download "$GITHUB_REF_NAME" -p "$artifact" \
                -O "$RUNNER_TEMP/$artifact" --clobber
              got=$(sha256sum "$RUNNER_TEMP/$artifact" | awk '{print $1}')
              p=${m#platforms/}
              p=${p%/template.json}
              if [ "$got" != "$want" ]; then
                echo "artifact $artifact digest $got does not match platforms/$p/template.json" >&2
                exit 1
              fi
            done
            if [ -z "$missing" ]; then
              echo "all template artifacts are uploaded and their digests match for $GITHUB_REF_NAME"
              exit 0
            fi
            echo "check at ${SECONDS}s: still missing:$missing"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timed out after 40 minutes waiting for template artifacts:$missing" >&2
              exit 1
            fi
            sleep 30
          done

      # The catalog component's tag field is the branch `release` and never
      # changes; this push fast-forwards it to the tagged commit. No force
      # flag: a tag that is not a descendant of the branch fails the job, and
      # the component keeps pointing at the previous release.
      - name: Move the release branch
        run: |
          set -euo pipefail
          # The checkout is full (fetch-depth: 0), so the ancestor check has
          # the history it needs; fetch the branch ref explicitly and tolerate
          # it missing on the very first release.
          git fetch --no-tags origin +refs/heads/release:refs/remotes/origin/release || true
          if git rev-parse --verify -q refs/remotes/origin/release >/dev/null; then
            git merge-base --is-ancestor refs/remotes/origin/release HEAD || {
              echo "release branch is not an ancestor of $GITHUB_REF_NAME" >&2
              exit 1
            }
          fi
          git push origin HEAD:refs/heads/release
